  <text x="92" y="306" class="s">other Pods</text>
  <path d="M126 302H148" class="ln" marker-end="url(#a)"/>
  <path d="M265 328L160 378" class="ln" marker-end="url(#a)"/><path d="M300 328V378" class="ln" marker-end="url(#a)"/><path d="M335 328L440 378" class="ln" marker-end="url(#a)"/>
  <rect x="85" y="380" width="130" height="46" rx="8" class="po"/>
  <text x="150" y="399" class="t">Pod</text>
  <text x="150" y="417" class="s">:8000 targetPort</text>
  <rect x="235" y="380" width="130" height="46" rx="8" class="po"/>
  <text x="300" y="399" class="t">Pod</text>
  <text x="300" y="417" class="s">:8000 targetPort</text>
  <rect x="385" y="380" width="130" height="46" rx="8" class="po"/>
