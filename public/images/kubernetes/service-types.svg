<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 510" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1f2430">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#545a66"/></marker>
    <style>
      .ln{stroke:#545a66;stroke-width:1.6;fill:none}
      .t{font-size:15px;font-weight:600;text-anchor:middle}
      .s{font-size:13px;text-anchor:middle;fill:#3d4350}
      .lb{fill:#efe6fb;stroke:#7b4bc4;stroke-width:1.5}
      .np{fill:#fff1dc;stroke:#d98a1c;stroke-width:1.5}
      .ci{fill:#e2e9fb;stroke:#2c56c0;stroke-width:1.5}
      .po{fill:#e3f6ec;stroke:#2f9e66;stroke-width:1.5}
      .br{stroke-width:2.5;fill:none}
      .bt{font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect x="230" y="12" width="140" height="38" rx="19" fill="#f3f4f6" stroke="#8a8f9c" stroke-width="1.5"/>
  <text x="300" y="36" class="t">Client</text>
