  <rect x="40" y="150" width="520" height="350" rx="14" fill="none" stroke="#8a8f9c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="56" y="170" font-size="13" fill="#545a66">Cluster</text>
  <path d="M255 132L175 178" class="ln" marker-end="url(#a)"/><path d="M345 132L425 178" class="ln" marker-end="url(#a)"/>
  <rect x="70" y="180" width="200" height="48" rx="8" class="np"/>
