  <text x="430" y="219" class="s">node-IP:31234</text>
  <path d="M175 228L255 274" class="ln" marker-end="url(#a)"/><path d="M425 228L345 274" class="ln" marker-end="url(#a)"/>
  <rect x="150" y="276" width="300" height="52" rx="8" class="ci"/>
