  <rect x="265" y="52" width="205" height="168" rx="10" fill="#fff" stroke="#8a8f9c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="281" y="72" font-size="13" fill="#545a66">Pod</text>
