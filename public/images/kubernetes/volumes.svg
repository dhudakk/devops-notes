    <style>
      .ln{stroke:#545a66;stroke-width:1.6;fill:none}
      .t{font-size:14px;font-weight:600;text-anchor:middle}
      .s{font-size:12px;text-anchor:middle;fill:#3d4350}
      .c{fill:#e3f6ec;stroke:#2f9e66;stroke-width:1.5}
      .v{fill:#fff1dc;stroke:#d98a1c;stroke-width:1.5}
      .p{fill:#e2e9fb;stroke:#2c56c0;stroke-width:1.5}
    </style>
  </defs>
  <rect x="15" y="15" width="475" height="310" rx="14" fill="#f7f7f9" stroke="#8a8f9c" stroke-width="1.5"/>
  <text x="32" y="38" font-size="14" font-weight="700" fill="#545a66">Node</text>
  <rect x="40" y="52" width="205" height="168" rx="10" fill="#fff" stroke="#8a8f9c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="72" font-size="13" fill="#545a66">Pod</text>
  <rect x="60" y="82" width="165" height="40" rx="7" class="c"/>
  <text x="142" y="107" class="t">container</text>
  <path d="M142 122V146" class="ln" marker-end="url(#a)"/>
